name: Build Frida Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Frida 17.16.4
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 17.16.4
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3 \
            python3-pip \
            git \
            clang \
            make \
            cmake \
            ninja-build \
            pkg-config

      - name: Install Android NDK r29
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.13846066"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/29.0.13846066" >> $GITHUB_ENV

      - name: Check NDK
        run: |
          echo $ANDROID_NDK_HOME
          ls $ANDROID_NDK_HOME

      - name: Build dependencies
        run: |
          ./releng/deps.py build --bundle=toolchain

      - name: Configure
        run: |
          ./configure --host=android-arm64

      - name: Build
        run: |
          make -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: frida-android-arm64
          path: |
            **/frida-server
